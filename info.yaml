# Tiny Tapeout project information
project:
  title:        "UNA-6 Custom Microprocessor & GPU"
  author:       "Zeenz123 (ASIC / Tiny Tapeout), Fulxor & Community (Architecture)"
  discord:      ""
  description:  "8-bit processor with integrated 2D/3D hardware graphics and math acceleration."
  language:     "Verilog"
  clock_hz:     25000000

  # Due to hardware geometric accelerators and 16-bit division, allocate 2x2 tiles
  tiles: "2x2"

  top_module:  "tt_um_una6_chip"

  source_files:
    - "project.v"

pinout:
  # Inputs
  ui[0]: "INPUT[0]"
  ui[1]: "INPUT[1]"
  ui[2]: "INPUT[2]"
  ui[3]: "INPUT[3]"
  ui[4]: "INPUT[4]"
  ui[5]: "INPUT[5]"
  ui[6]: "INPUT[6]"
  ui[7]: "INPUT[7]"

  # Outputs
  uo[0]: "DATAOUT[0]"
  uo[1]: "DATAOUT[1]"
  uo[2]: "DATAOUT[2]"
  uo[3]: "DATAOUT[3]"
  uo[4]: "DATAOUT[4]"
  uo[5]: "DATAOUT[5]"
  uo[6]: "DATAOUT[6]"
  uo[7]: "DATAOUT[7]"

  # Bidirectional pins
  uio[0]: "OUTSIDECONTROL[0]"
  uio[1]: "OUTSIDECONTROL[1]"
  uio[2]: "OUTSIDECONTROL[2]"
  uio[3]: "OUTSIDECONTROL[3]"
  uio[4]: "OUTSIDECONTROL[4]"
  uio[5]: "OUTSIDECONTROL[5]"
  uio[6]: "X (Rasterizer)"
  uio[7]: "Y (Rasterizer)"

# Do not change!
yaml_version: 6
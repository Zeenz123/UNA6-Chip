name: gds

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pre-fetch Sky130 PDK with retry
        shell: bash
        run: |
          echo "=== Pre-fetching Sky130 PDK to prevent Volare ReadTimeout ==="
          pip install --upgrade volare
          # Retry up to 5 times if GitHub releases throttles or drops connection
          for i in {1..5}; do
            echo "Attempt $i to fetch PDK..."
            volare enable --pdk sky130 0fe599b2afb6708d281543108caf8310912f54af && break || sleep 10
          done
          echo "PDK pre-fetch completed."

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@tt10
        with:
          flow: openlane2

      - name: Print OpenLane Error Summary
        if: failure()
        shell: bash
        run: |
          echo "=== SEARCHING ERRORS IN ALL LOGS ==="
          grep -rn -E "\[ERROR|ERROR:|[A-Z]{3,4}-[0-9]{4}" runs/wokwi/ || true

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@tt10

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@tt10

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@tt10
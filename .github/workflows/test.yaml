name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install yosys
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y yosys

      - name: Print Modules Parsed by Yosys
        shell: bash
        run: |
          echo "=== DUMPING YOSYS LOG ==="
          yosys -p "read_verilog src/project.v; tee -o parsed_modules.txt ls"
          cat parsed_modules.txt
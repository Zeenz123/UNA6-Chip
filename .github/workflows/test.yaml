name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install iverilog and yosys
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys

      - name: Test Yosys Parsing Directly
        shell: bash
        run: |
          echo "=== RUNNING YOSYS ON SRC/PROJECT.V ==="
          yosys -p "read_verilog src/project.v; hierarchy -check -top tt_um_una6_chip"

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        shell: bash
        run: |
          cd test
          make clean
          make
name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install yosys
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y yosys

      - name: Print Yosys Error Directly
        shell: bash
        run: |
          yosys -p "read_verilog src/project.v; hierarchy -check -top tt_um_una6_chip" 2>&1 | grep -B 2 -A 5 -i "error" || true
          echo "=== FIRST 50 LINES OF YOSYS ==="
          yosys -p "read_verilog src/project.v; hierarchy -check -top tt_um_una6_chip" 2>&1 | head -n 50
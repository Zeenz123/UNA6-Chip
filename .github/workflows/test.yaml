name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install yosys
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y yosys

      - name: Run Yosys and save log
        shell: bash
        run: |
          yosys -p "read_verilog src/project.v; hierarchy -check -top tt_um_una6_chip" > yosys_output.txt 2>&1 || true
          tail -n 100 yosys_output.txt

      - name: Upload yosys log
        uses: actions/upload-artifact@v4
        with:
          name: yosys-log
          path: yosys_output.txt